# package.json is at the repository root, not money-os-desk/.
# No Kalshi or other secrets. Feeds in the browser tests are mocked.
name: CI

on:
  push:
  pull_request:

jobs:
  test:
    name: Unit, typecheck, build, Playwright
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      MODE: PAPER
      TRADING_ENABLED: "false"
      KALSHI_ENV: demo
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Unit tests
        run: npm test

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Vite build
        run: npx vite build

      - name: Server bundle
        run: node scripts/bundle-server.mjs

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Playwright
        run: npx playwright test --reporter=list,html

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            generated-artifacts/test-results/
          if-no-files-found: ignore
          retention-days: 14
